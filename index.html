<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ropita Stock</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4f7a6b">
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --ink:#2e2a26;
    --ink-soft:#6f6a63;
    --line:#e7e1d8;
    --accent:#4f7a6b;
    --accent-soft:#e4efe9;
    --danger:#b3543f;
    --danger-soft:#f6e6e1;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:78px;
  }
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em;}
  button{font-family:inherit;}
  .hide{display:none !important;}

  /* Header */
  header{
    padding:18px 16px 14px;
    background:var(--bg);
    position:sticky;top:0;z-index:5;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:1.35rem;}
  header .sub{color:var(--ink-soft);font-size:.85rem;margin-top:2px;}

  /* Bottom nav */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;background:var(--card);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabs button{
    flex:1;background:none;border:none;padding:8px 2px;
    color:var(--ink-soft);font-size:.7rem;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border-radius:10px;
  }
  nav.tabs button .ic{font-size:1.25rem;}
  nav.tabs button.active{color:var(--accent);background:var(--accent-soft);}

  main{padding:14px 16px 20px;max-width:640px;margin:0 auto;}

  /* Filter bar */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;
  }
  .filters select, .filters input[type=text]{
    flex:1;min-width:120px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:.9rem;
  }
  .filters .full{flex-basis:100%;}

  .share-row{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
  .btn{
    padding:11px 16px;border-radius:10px;border:none;font-weight:600;
    font-size:.9rem;cursor:pointer;
  }
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:var(--card);color:var(--accent);border:1px solid var(--accent);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
  .btn:disabled{opacity:.5;}
  .count-pill{
    align-self:center;color:var(--ink-soft);font-size:.82rem;
  }

  /* Grid of items */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;position:relative;
  }
  .card.soldout{opacity:.55;}
  .card .thumb{
    width:100%;aspect-ratio:1/1;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .thumb .ph-count{
    position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);
    color:#fff;font-size:.68rem;padding:2px 6px;border-radius:8px;
  }
  .card .info{padding:9px 10px 11px;}
  .card .name{font-size:.88rem;font-weight:700;line-height:1.2;}
  .card .meta{font-size:.76rem;color:var(--ink-soft);margin-top:3px;}
  .card .sizes-line{font-size:.74rem;color:var(--accent);margin-top:4px;font-weight:600;}
  .card .soldout-tag{font-size:.74rem;color:var(--danger);margin-top:4px;font-weight:700;}
  .card .pick{
    position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;
    border:2px solid #fff;background:rgba(255,255,255,.35);
  }
  .card .pick.on{background:var(--accent);border-color:var(--accent);}
  .card .admin-actions{
    display:flex;gap:6px;padding:0 10px 10px;
  }
  .card .admin-actions button{
    flex:1;padding:7px 0;font-size:.76rem;border-radius:8px;border:1px solid var(--line);
    background:var(--card);font-weight:600;
  }
  .card .admin-actions .del{color:var(--danger);border-color:var(--danger-soft);}
  .card .admin-actions .ed{color:var(--accent);}

  .variant-list{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 10px;}
  .variant-chip{
    display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    border-radius:16px;padding:4px 6px 4px 10px;font-size:.74rem;font-weight:700;
  }
  .variant-chip.zero{background:var(--danger-soft);color:var(--danger);}
  .variant-chip button{
    border:none;background:rgba(255,255,255,.7);color:inherit;border-radius:50%;
    width:18px;height:18px;font-size:.65rem;line-height:1;font-weight:700;
  }

  .empty{
    text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:.92rem;
  }

  /* FAB */
  .fab{
    position:fixed;right:18px;bottom:80px;width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:1.7rem;border:none;
    box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:8;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(30,26,22,.5);z-index:20;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet .close{background:none;border:none;font-size:1.4rem;color:var(--ink-soft);}
  label.field{display:block;margin-bottom:14px;}
  label.field span{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-size:.95rem;color:var(--ink);
  }
  .field textarea{min-height:70px;resize:vertical;}
  .addnew-row{display:flex;gap:6px;margin-top:6px;}
  .addnew-row input{flex:1;}
  .addnew-row button{padding:0 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;}

  .size-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .size-toggle{
    padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:.85rem;font-weight:600;
  }
  .size-toggle.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .qty-rows{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .qty-row .lbl{font-weight:700;font-size:.88rem;}
  .qty-stepper{display:flex;align-items:center;gap:10px;}
  .qty-stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1rem;font-weight:700;color:var(--accent);}
  .qty-stepper span{min-width:22px;text-align:center;font-weight:700;}

  .photo-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-thumb{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb .rm{
    position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;
    border:none;border-radius:50%;width:20px;height:20px;font-size:.75rem;line-height:1;
  }
  .add-photo-btn{
    width:74px;height:74px;border-radius:10px;border:2px dashed var(--line);
    background:none;color:var(--ink-soft);font-size:1.5rem;
  }

  .detail-photos{display:flex;overflow-x:auto;gap:8px;margin:-4px -4px 14px;padding:4px;scroll-snap-type:x mandatory;}
  .detail-photos img{
    width:100%;max-width:100%;flex:0 0 100%;aspect-ratio:4/5;object-fit:cover;
    border-radius:14px;scroll-snap-align:start;
  }
  .detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600;text-align:right;max-width:60%;}
  .detail-sizes{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:60%;}
  .detail-sizes span{background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:12px;font-size:.78rem;font-weight:700;}
  .detail-notes{margin-top:12px;font-size:.9rem;color:var(--ink);line-height:1.45;}

  .confirm-box{padding:6px 2px 2px;}
  .confirm-box p{font-size:.95rem;margin:0 0 16px;color:var(--ink);}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:.92rem;border:none;}

  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:.85rem;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* Sales section */
  .sales-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .sales-toggle button{
    flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);font-weight:700;font-size:.85rem;
  }
  .sales-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .month-select-row{margin-bottom:14px;}
  .month-select-row select{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:.9rem;
  }
  .add-entry-row{margin-bottom:14px;}
  .add-entry-row .btn{width:100%;}
  .sales-summary{
    display:flex;gap:10px;margin-bottom:14px;
  }
  .sales-summary .box{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;
  }
  .sales-summary .box .n{font-size:1.15rem;font-weight:800;color:var(--accent);}
  .sales-summary .box .l{font-size:.72rem;color:var(--ink-soft);margin-top:2px;}
  .month-group{margin-bottom:18px;}
  .month-group h3{
    font-size:.95rem;text-transform:capitalize;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .month-group h3 .mcount{font-size:.76rem;color:var(--ink-soft);font-weight:600;}
  .sale-row{
    display:flex;gap:10px;align-items:center;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;
  }
  .sale-row .sthumb{
    width:46px;height:46px;border-radius:8px;overflow:hidden;flex-shrink:0;
    background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  }
  .sale-row .sthumb img{width:100%;height:100%;object-fit:cover;}
  .sale-row .sinfo{flex:1;min-width:0;}
  .sale-row .sname{font-size:.85rem;font-weight:700;line-height:1.2;}
  .sale-row .smeta{font-size:.74rem;color:var(--ink-soft);margin-top:2px;}
  .sale-row .sprice{font-size:.82rem;font-weight:700;color:var(--accent);white-space:nowrap;}
  .sale-row .sdel{background:none;border:none;color:var(--danger);font-size:1rem;padding:4px;}
</style>
</head>
<body>

<header>
  <h1>Ropita Stock</h1>
  <div class="sub" id="headerSub">Catálogo</div>
</header>

<main>

  <div id="viewCatalog">
    <div class="filters">
      <input type="text" id="fSearch" placeholder="Buscar por nombre...">
      <select id="fCategory"><option value="">Todas las categorías</option></select>
      <select id="fSize"><option value="">Todos los talles</option></select>
    </div>
    <div class="share-row">
      <button class="btn btn-accent" id="btnShare">Compartir seleccionados</button>
      <span class="count-pill" id="selCount">0 seleccionados</span>
    </div>
    <div class="grid" id="catalogGrid"></div>
    <div class="empty hide" id="catalogEmpty">No hay prendas que coincidan con el filtro.</div>
  </div>

  <div id="viewAdmin" class="hide">
    <div class="filters">
      <input type="text" id="aSearch" placeholder="Buscar por nombre...">
      <select id="aCategory"><option value="">Todas las categorías</option></select>
      <select id="aSize"><option value="">Todos los talles</option></select>
    </div>
    <div class="grid" id="adminGrid"></div>
    <div class="empty hide" id="adminEmpty">Todavía no agregaste ninguna prenda. Tocá el botón + para empezar.</div>
  </div>

  <div id="viewSales" class="hide">
    <div class="sales-toggle">
      <button id="salesModeMonth" class="active">Por mes</button>
      <button id="salesModeList">Lista completa</button>
    </div>
    <div class="month-select-row" id="salesMonthRow">
      <select id="salesMonthSelect"></select>
    </div>
    <div class="sales-summary">
      <div class="box"><div class="n" id="salesTotalCount">0</div><div class="l">prendas vendidas</div></div>
      <div class="box"><div class="n" id="salesTotalMoney">$0</div><div class="l">total vendido</div></div>
    </div>
    <div id="salesContent"></div>
    <div class="empty hide" id="salesEmpty">Todavía no registraste ninguna venta.</div>
  </div>

  <div id="viewExpenses" class="hide">
    <div class="add-entry-row">
      <button class="btn btn-accent" id="btnAddExpense">+ Agregar gasto</button>
    </div>
    <div class="sales-toggle">
      <button id="expModeMonth" class="active">Por mes</button>
      <button id="expModeList">Lista completa</button>
    </div>
    <div class="month-select-row" id="expMonthRow">
      <select id="expMonthSelect"></select>
    </div>
    <div class="sales-summary">
      <div class="box"><div class="n" id="expTotalCount">0</div><div class="l">gastos cargados</div></div>
      <div class="box"><div class="n" id="expTotalMoney">$0</div><div class="l">total gastado</div></div>
    </div>
    <div id="expContent"></div>
    <div class="empty hide" id="expEmpty">Todavía no cargaste ningún gasto.</div>
  </div>

</main>

<button class="fab hide" id="fabAdd">+</button>

<nav class="tabs">
  <button id="tabCatalogBtn" class="active"><span class="ic">👀</span>Ver</button>
  <button id="tabAdminBtn"><span class="ic">✏️</span>Administrar</button>
  <button id="tabSalesBtn"><span class="ic">💰</span>Vendido</button>
  <button id="tabExpensesBtn"><span class="ic">🧾</span>Gastos</button>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Storage helpers ---------------- */
const LS_ITEMS = 'ropita_items';
const LS_CATS = 'ropita_categories';
const LS_SIZES = 'ropita_sizes';
const LS_SALES = 'ropita_sales';
const LS_EXPENSES = 'ropita_expenses';
const LS_EXP_CATS = 'ropita_exp_categories';

function load(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let items = load(LS_ITEMS, []);
let categories = load(LS_CATS, ['Bodies','Remeras','Pantalones','Conjuntos','Camperas','Vestidos','Pijamas','Accesorios']);
let sizes = load(LS_SIZES, ['Prematuro','RN','0-3M','3-6M','6-9M','9-12M','12-18M','18-24M','2','4','6','8']);
let sales = load(LS_SALES, []);
let expenses = load(LS_EXPENSES, []);
let expCategories = load(LS_EXP_CATS, ['Mercadería','Envío','Insumos/Embalaje','Otros']);

/* Migración: prendas viejas tenían "size" único -> ahora usamos "variants":[{size,qty}] */
let migrated = false;
items.forEach(it=>{
  if(!it.variants){
    it.variants = it.size ? [{size: it.size, qty: 1}] : [];
    delete it.size;
    migrated = true;
  }
});
if(migrated) save(LS_ITEMS, items);

function persistItems(){ save(LS_ITEMS, items); }
function persistCats(){ save(LS_CATS, categories); }
function persistSizes(){ save(LS_SIZES, sizes); }
function persistSales(){ save(LS_SALES, sales); }
function persistExpenses(){ save(LS_EXPENSES, expenses); }
function persistExpCats(){ save(LS_EXP_CATS, expCategories); }

let selectedIds = new Set();
let currentView = 'catalog'; // 'catalog' | 'admin'

/* ---------------- Utilities ---------------- */
function uid(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function totalQty(it){ return it.variants.reduce((s,v)=>s+v.qty,0); }

function compressImage(file, maxSize=1000, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; }
        else if(h >= w && h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLtoFile(dataurl, filename){
  const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8 = new Uint8Array(n);
  while(n--){ u8[n] = bstr.charCodeAt(n); }
  return new File([u8], filename, {type:mime});
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- Select population ---------------- */
function fillSelect(sel, list, placeholder){
  const current = sel.value;
  sel.innerHTML = `<option value="">${placeholder}</option>` + list.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if(list.includes(current)) sel.value = current;
}
function refreshFilterSelects(){
  fillSelect(document.getElementById('fCategory'), categories, 'Todas las categorías');
  fillSelect(document.getElementById('fSize'), sizes, 'Todos los talles');
  fillSelect(document.getElementById('aCategory'), categories, 'Todas las categorías');
  fillSelect(document.getElementById('aSize'), sizes, 'Todos los talles');
}
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Filtering ---------------- */
function getFiltered(prefix, onlyInStock){
  const search = document.getElementById(prefix+'Search').value.trim().toLowerCase();
  const cat = document.getElementById(prefix==='f'?'fCategory':'aCategory').value;
  const size = document.getElementById(prefix==='f'?'fSize':'aSize').value;
  return items.filter(it=>{
    if(search && !it.name.toLowerCase().includes(search)) return false;
    if(cat && it.category !== cat) return false;
    if(size && !it.variants.some(v=>v.size===size && v.qty>0)) return false;
    if(onlyInStock && totalQty(it) <= 0) return false;
    return true;
  }).sort((a,b)=> b.createdAt - a.createdAt);
}

function sizesLine(it){
  return it.variants.filter(v=>v.qty>0).map(v=>`${v.size} (${v.qty})`).join(' · ');
}

/* ---------------- Rendering: Catalog (view-only) ---------------- */
function renderCatalog(){
  const grid = document.getElementById('catalogGrid');
  const empty = document.getElementById('catalogEmpty');
  const list = getFiltered('f', true); // catálogo solo muestra lo que hay en stock
  grid.innerHTML = '';
  empty.classList.toggle('hide', list.length>0);
  list.forEach(it=>{
    const card = document.createElement('div');
    card.className = 'card';
    const thumb = it.photos[0];
    card.innerHTML = `
      <div class="pick ${selectedIds.has(it.id)?'on':''}" data-pick="${it.id}"></div>
      <div class="thumb" data-open="${it.id}">
        ${thumb ? `<img src="${thumb}">` : `<span style="font-size:1.6rem">👕</span>`}
        ${it.photos.length>1?`<span class="ph-count">${it.photos.length} fotos</span>`:''}
      </div>
      <div class="info" data-open="${it.id}">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="meta">${escapeHtml(it.category||'—')}</div>
        <div class="sizes-line">${escapeHtml(sizesLine(it))}</div>
      </div>`;
    grid.appendChild(card);
  });
  updateSelCount();
}

function updateSelCount(){
  document.getElementById('selCount').textContent = selectedIds.size + ' seleccionados';
  document.getElementById('btnShare').disabled = selectedIds.size === 0;
}

/* ---------------- Rendering: Admin ---------------- */
function renderAdmin(){
  const grid = document.getElementById('adminGrid');
  const empty = document.getElementById('adminEmpty');

/* ---------------- Add / Edit form ---------------- */
let formPhotos = []; // array of dataURLs while editing
let formVariants = {}; // { size: qty } mientras se edita el formulario

  const editing = !!id;

  root.innerHTML = `

      <div class="sheet">
        <div class="sheet-head">

          </div>
          <div class="qty-rows" id="qtyRows"></div>
        </label>

          <span>Precio (opcional)</span>
          <input type="number" id="fPrice" value="${escapeHtml(it.price)}" placeholder="0">
        </label>

        <label class="field">
          <span>Notas (opcional)</span>
          <textarea id="fNotes" placeholder="Estado, detalles, etc.">${escapeHtml(it.notes)}</textarea>
        </label>

        <label class="field">
          <span>Fotos</span>
          <div class="photo-row" id="photoRow"></div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none">

    const v = document.getElementById('newCat').value.trim();
    if(!v) return;
    if(!categories.includes(v)) categories.push(v);
    persistCats(); refreshFilterSelects();
    fillSelect(document.getElementById('fCategorySel'), categories, 'Elegir categoría');
    document.getElementById('fCategorySel').value = v;
    document.getElementById('newCat').value='';
  };
  document.getElementById('addSizeBtn').onclick = ()=>{
    const v = document.getElementById('newSize').value.trim();
    if(!v) return;
    if(!sizes.includes(v)) sizes.push(v);
    persistSizes(); refreshFilterSelects();
    formVariants[v] = formVariants[v] || 1;

function renderSizePicker(){
  const picker = document.getElementById('sizePicker');
  picker.innerHTML = sizes.map(s=>`

  `).join('');
  picker.querySelectorAll('[data-size]').forEach(btn=>{
    btn.onclick = ()=>{
      const s = btn.dataset.size;
      if(formVariants.hasOwnProperty(s)){ delete formVariants[s]; }
      else { formVariants[s] = 1; }
      renderSizePicker();
      renderQtyRows();
    };
  });
  renderQtyRows();
}

function renderQtyRows(){
  const wrap = document.getElementById('qtyRows');
  const keys = Object.keys(formVariants);
  wrap.innerHTML = keys.map(s=>`
    <div class="qty-row">
      <span class="lbl">${escapeHtml(s)}</span>
      <div class="qty-stepper">
        <button type="button" data-dec="${escapeHtml(s)}">−</button>
        <span>${formVariants[s]}</span>
        <button type="button" data-inc="${escapeHtml(s)}">+</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('[data-inc]').forEach(b=>{
    b.onclick = ()=>{ formVariants[b.dataset.inc]++; renderQtyRows(); };
  });
  wrap.querySelectorAll('[data-dec]').forEach(b=>{
    b.onclick = ()=>{
      const s = b.dataset.dec;
      formVariants[s] = Math.max(1, formVariants[s]-1);
      renderQtyRows();
    };
  });
}

function renderPhotoRow(){
  const row = document.getElementById('photoRow');
  row.innerHTML = formPhotos.map((p,i)=>`

function confirmSell(id, size){
  const it = items.find(x=>x.id===id);
  if(!it) return;
  const variant = it.variants.find(v=>v.size===size);
  if(!variant || variant.qty<=0) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <div class="sheet-head"><h3>Marcar como vendido</h3></div>
        <div class="confirm-box">
          <p>¿Confirmás que se vendió <strong>${escapeHtml(it.name)}</strong> talle <strong>${escapeHtml(size)}</strong>? Quedarían ${variant.qty-1} de ese talle.</p>
          <div class="confirm-actions">
            <button class="btn-ghost" id="cancelSell">Cancelar</button>
            <button class="btn-accent" id="okSell">Confirmar venta</button>
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelSell').onclick = closeModal;
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') closeModal(); };
  document.getElementById('okSell').onclick = ()=>{
    variant.qty = Math.max(0, variant.qty - 1);
    persistItems();
    sales.push({
      id: uid(),
      itemId: it.id,
      name: it.name,
      category: it.category,
      size: size,
      price: it.price,
      photo: it.photos[0] || null,
      soldAt: Date.now()
    });
    persistSales();
    closeModal();
    renderAll();
    showToast('Venta registrada, stock actualizado');
  };
}

document.getElementById('btnShare').onclick = async ()=>{
  if(selectedIds.size===0) return;
  const selectedItems = items.filter(i=>selectedIds.has(i.id));
  const allPhotos = [];
  selectedItems.forEach(it=>{
    it.photos.forEach((p,idx)=> allPhotos.push({dataUrl:p, name: it.name.replace(/[^a-z0-9]+/gi,'_') + '_' + (idx+1) + '.jpg'}));
  });
  if(allPhotos.length === 0){
    showToast('Las prendas seleccionadas no tienen fotos');
    return;
  }
  const files = allPhotos.map(p=>dataURLtoFile(p.dataUrl, p.name));
  const namesList = selectedItems.map(i=>`${i.name} (${sizesLine(i)||'sin stock'})`).join(', ');

  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({
        files,
        title:'Stock disponible',
        text:`Te comparto: ${namesList}`
      });
      return;
    }catch(err){
      if(err.name === 'AbortError') return;
      console.error(err);
    }
  }
  // Fallback: no Web Share API con archivos disponible en este navegador
  openFallbackShare(allPhotos, namesList);
};

/* ---------------- Vendido: por mes (con selector) / lista completa ---------------- */
let salesMode = 'month'; // 'month' | 'list'
let salesSelectedMonth = ''; // '' = todos los meses

document.getElementById('salesModeMonth').onclick = ()=>{ salesMode='month'; renderSales(); };
document.getElementById('salesModeList').onclick = ()=>{ salesMode='list'; renderSales(); };
document.getElementById('salesMonthSelect').addEventListener('change', e=>{
  salesSelectedMonth = e.target.value;
  renderSales();
});

function moneyFmt(n){
  if(!n || isNaN(n)) return null;
  return '$' + Number(n).toLocaleString('es-AR');
}

function monthKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(ts){
  return new Date(ts).toLocaleDateString('es-AR', {month:'long', year:'numeric'});
}

function populateMonthSelect(selectEl, records, selectedValue){
  const keys = [...new Set(records.map(r=>monthKey(r.soldAt || r.date)))].sort().reverse();
  const labels = {};
  records.forEach(r=>{ labels[monthKey(r.soldAt || r.date)] = monthLabel(r.soldAt || r.date); });
  selectEl.innerHTML = `<option value="">Todos los meses</option>` +
    keys.map(k=>`<option value="${k}">${escapeHtml(labels[k])}</option>`).join('');
  selectEl.value = keys.includes(selectedValue) ? selectedValue : '';
}

function saleRowHtml(s){
  const dateStr = new Date(s.soldAt).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
  return `
    <div class="sale-row">
      <div class="sthumb">${s.photo ? `<img src="${s.photo}">` : '👕'}</div>
      <div class="sinfo">
        <div class="sname">${escapeHtml(s.name)}</div>
        <div class="smeta">${escapeHtml(s.category||'—')} · Talle ${escapeHtml(s.size)} · ${dateStr}</div>
      </div>
      ${s.price ? `<div class="sprice">${moneyFmt(s.price)}</div>` : ''}
      <button class="sdel" data-delsale="${s.id}" title="Eliminar registro">✕</button>
    </div>`;
}

function renderSales(){
  document.getElementById('salesModeMonth').classList.toggle('active', salesMode==='month');
  document.getElementById('salesModeList').classList.toggle('active', salesMode==='list');
  document.getElementById('salesMonthRow').classList.toggle('hide', salesMode!=='month');

  const content = document.getElementById('salesContent');
  const empty = document.getElementById('salesEmpty');
  const allSorted = [...sales].sort((a,b)=>b.soldAt-a.soldAt);

  empty.classList.toggle('hide', allSorted.length>0);
  if(allSorted.length===0){ content.innerHTML=''; document.getElementById('salesTotalCount').textContent='0'; document.getElementById('salesTotalMoney').textContent='$0'; return; }

  if(salesMode==='month'){
    populateMonthSelect(document.getElementById('salesMonthSelect'), allSorted, salesSelectedMonth);
    salesSelectedMonth = document.getElementById('salesMonthSelect').value;
  }

  const filtered = (salesMode==='month' && salesSelectedMonth)
    ? allSorted.filter(s=>monthKey(s.soldAt)===salesSelectedMonth)
    : allSorted;

  const totalCount = filtered.length;
  const totalMoney = filtered.reduce((s,x)=> s + (Number(x.price)||0), 0);
  document.getElementById('salesTotalCount').textContent = totalCount;
  document.getElementById('salesTotalMoney').textContent = moneyFmt(totalMoney) || '$0';

  if(salesMode === 'list' || salesSelectedMonth){
    content.innerHTML = filtered.map(saleRowHtml).join('');
  } else {
    const groups = {};
    filtered.forEach(s=>{
      const key = monthKey(s.soldAt);
      if(!groups[key]) groups[key] = [];
      groups[key].push(s);
    });
    content.innerHTML = Object.keys(groups).sort().reverse().map(key=>{
      const list = groups[key];
      const label = monthLabel(list[0].soldAt);
      const monthMoney = list.reduce((s,x)=> s + (Number(x.price)||0), 0);
      return `
        <div class="month-group">
          <h3>${escapeHtml(label)} <span class="mcount">${list.length} vendidas${monthMoney>0?' · '+moneyFmt(monthMoney):''}</span></h3>
          ${list.map(saleRowHtml).join('')}
        </div>`;
    }).join('');
  }
}

          <div class="confirm-actions">

      </div>
      <div class="sprice">${moneyFmt(x.amount) || '$0'}</div>
      <button class="ed" style="border:none;background:none;color:var(--accent);padding:4px;font-size:.85rem;" data-editexp="${x.id}" title="Editar">✏️</button>
      <button class="sdel" data-delexp="${x.id}" title="Eliminar">✕</button>
    </div>`;
}

function renderExpenses(){
  document.getElementById('expModeMonth').classList.toggle('active', expMode==='month');
  document.getElementById('expModeList').classList.toggle('active', expMode==='list');
  document.getElementById('expMonthRow').classList.toggle('hide', expMode!=='month');

  const content = document.getElementById('expContent');
  const empty = document.getElementById('expEmpty');
  const allSorted = [...expenses].sort((a,b)=>b.date-a.date);

  empty.classList.toggle('hide', allSorted.length>0);
  if(allSorted.length===0){ content.innerHTML=''; document.getElementById('expTotalCount').textContent='0'; document.getElementById('expTotalMoney').textContent='$0'; return; }

  if(expMode==='month'){
    populateMonthSelect(document.getElementById('expMonthSelect'), allSorted.map(x=>({soldAt:x.date})), expSelectedMonth);
    expSelectedMonth = document.getElementById('expMonthSelect').value;
  }

  const filtered = (expMode==='month' && expSelectedMonth)
    ? allSorted.filter(x=>monthKey(x.date)===expSelectedMonth)
    : allSorted;

  const totalCount = filtered.length;
  const totalMoney = filtered.reduce((s,x)=> s + (Number(x.amount)||0), 0);
  document.getElementById('expTotalCount').textContent = totalCount;
  document.getElementById('expTotalMoney').textContent = moneyFmt(totalMoney) || '$0';

  if(expMode === 'list' || expSelectedMonth){
    content.innerHTML = filtered.map(expRowHtml).join('');
  } else {
    const groups = {};
    filtered.forEach(x=>{
      const key = monthKey(x.date);
      if(!groups[key]) groups[key] = [];
      groups[key].push(x);
    });
    content.innerHTML = Object.keys(groups).sort().reverse().map(key=>{
      const list = groups[key];
      const label = monthLabel(list[0].date);
      const monthMoney = list.reduce((s,x)=> s + (Number(x.amount)||0), 0);
      return `
        <div class="month-group">
          <h3>${escapeHtml(label)} <span class="mcount">${list.length} gastos · ${moneyFmt(monthMoney)||'$0'}</span></h3>
          ${list.map(expRowHtml).join('')}
        </div>`;
    }).join('');
  }
}

document.getElementById('expContent').addEventListener('click', e=>{
  const ed = e.target.closest('[data-editexp]');
  if(ed){ openExpenseForm(ed.dataset.editexp); return; }
  const del = e.target.closest('[data-delexp]');
  if(del){ confirmDeleteExpense(del.dataset.delexp); }
});

function openExpenseForm(id){
  const editing = !!id;
  const x = editing ? expenses.find(e=>e.id===id) : {desc:'', amount:'', category:'', date: Date.now()};
  const dateInputVal = new Date(x.date).toISOString().slice(0,10);

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <div class="sheet-head">
          <h3>${editing?'Editar gasto':'Agregar gasto'}</h3>
          <button class="close" id="closeExpForm">✕</button>
        </div>

        <label class="field">
          <span>Descripción</span>
          <input type="text" id="eDesc" value="${escapeHtml(x.desc)}" placeholder="Ej: Compra de mercadería">
        </label>

        <label class="field">
          <span>Monto</span>
          <input type="number" id="eAmount" value="${escapeHtml(x.amount)}" placeholder="0">
        </label>

        <label class="field">
          <span>Categoría</span>
          <select id="eCategorySel"></select>
          <div class="addnew-row">
            <input type="text" id="newExpCat" placeholder="Nueva categoría...">
            <button id="addExpCatBtn" type="button">Agregar</button>
          </div>
        </label>

        <label class="field">
          <span>Fecha</span>
          <input type="date" id="eDate" value="${dateInputVal}">
        </label>

        <div class="confirm-actions" style="margin-top:8px;">
          <button class="btn-ghost" id="cancelExpForm" type="button">Cancelar</button>
          <button class="btn-accent" id="saveExpForm" type="button">${editing?'Guardar cambios':'Agregar gasto'}</button>
        </div>
      </div>
    </div>`;

  fillSelect(document.getElementById('eCategorySel'), expCategories, 'Elegir categoría');
  document.getElementById('eCategorySel').value = x.category || '';

  document.getElementById('addExpCatBtn').onclick = ()=>{
    const v = document.getElementById('newExpCat').value.trim();
    if(!v) return;
    if(!expCategories.includes(v)) expCategories.push(v);
    persistExpCats();
    fillSelect(document.getElementById('eCategorySel'), expCategories, 'Elegir categoría');
    document.getElementById('eCategorySel').value = v;
    document.getElementById('newExpCat').value='';
  };

  document.getElementById('closeExpForm').onclick = closeModal;
  document.getElementById('cancelExpForm').onclick = closeModal;
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') closeModal(); };

  document.getElementById('saveExpForm').onclick = ()=>{
    const desc = document.getElementById('eDesc').value.trim();
    const amount = document.getElementById('eAmount').value.trim();
    if(!desc){ showToast('Poné una descripción para el gasto'); return; }
    if(!amount || isNaN(amount)){ showToast('Poné un monto válido'); return; }
    const dateVal = document.getElementById('eDate').value;
    const data = {
      id: editing ? x.id : uid(),
      desc,
      amount: Number(amount),
      category: document.getElementById('eCategorySel').value,
      date: dateVal ? new Date(dateVal + 'T12:00:00').getTime() : Date.now()
    };
    if(editing){
      const idx = expenses.findIndex(e=>e.id===x.id);
      expenses[idx] = data;
    } else {
      expenses.push(data);
    }
    persistExpenses();
    closeModal();
    renderExpenses();
    showToast(editing?'Gasto actualizado':'Gasto agregado');
  };
}

function confirmDeleteExpense(id){
  const x = expenses.find(e=>e.id===id);
  if(!x) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <div class="sheet-head"><h3>Eliminar gasto</h3></div>
        <div class="confirm-box">
          <p>¿Seguro que querés eliminar el gasto "<strong>${escapeHtml(x.desc)}</strong>"? Esta acción no se puede deshacer.</p>
          <div class="confirm-actions">
            <button class="btn-ghost" id="cancelDelExp">Cancelar</button>
            <button class="btn-danger" id="okDelExp">Eliminar</button>
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelDelExp').onclick = closeModal;
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') closeModal(); };
  document.getElementById('okDelExp').onclick = ()=>{
    expenses = expenses.filter(e=>e.id!==id);
    persistExpenses();
    closeModal();
    renderExpenses();
    showToast('Gasto eliminado');
  };
}

/* ---------------- Init ---------------- */
function renderAll(){
  refreshFilterSelects();
  renderCatalog();
  renderAdmin();
  renderSales();
  renderExpenses();
}
renderAll();
switchView('catalog');
